<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>engpit</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header class="top">
  <a class="logo" aria-label="engpit"><span>engp</span><span class="li">ı<i class="cap"></i></span><span>t</span></a>
  <nav class="tabs">
    <button data-tab="gacha" class="active"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M6 9h12M8 21h8M12 15v6"/></svg><span>뽑기</span></button>
    <button data-tab="battle"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/></svg><span>전투</span></button>
    <button data-tab="word"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h5"/></svg><span>단어</span></button>
    <button data-tab="dex"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>도감</span></button>
    <button data-tab="store"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>상점</span></button>
    <button data-tab="rank"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span>랭킹</span></button>
  </nav>
  <div class="top-right">
  <button class="mute" id="muteBtn" aria-label="소리 켜기/끄기">
    <svg class="ic on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
    <svg class="ic off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
  </button>
  <button class="tchip" id="titleChip" hidden></button>
  <button class="acct" id="acctBtn">로그인</button>
  <div class="coin" id="coinBox" title="보유 코인"><i class="ci"></i><b id="coinNum">0</b></div>
  </div>
</header>

<main>
  <!-- 뽑기 -->
  <section id="tab-gacha" class="tab active">
    <div id="stage">
      <div class="odds" id="odds"></div>
      <div class="flash" id="flash"></div>
      <div class="banner" id="banner"></div>
      <div class="autobox">
        <button class="btn" id="autoBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><b>자동 뽑기</b></button>
        <button class="auto-opt" id="autoOpt" aria-label="자동 뽑기 설정">설정</button>
        <div class="auto-opts">
        <label>멈춤 조건
          <select id="autoStop">
            <option value="">멈추지 않음</option>
            <option value="hero">영웅 이상</option>
            <option value="legend">레전더리 이상</option>
            <option value="ultra">울트라</option>
          </select>
        </label>
        </div>
      </div>
      <div class="pullbar" id="pullbar">
        <div class="pullrow">
          <button class="btn mpull" id="pull10"><b>10회</b><small><i class="ci"></i>10</small></button>
          <button class="pull" id="pullBtn"><b>뽑기</b><small><i class="ci"></i>1</small></button>
          <button class="btn mpull" id="pull100"><b>100회</b><small><i class="ci"></i>100</small></button>
        </div>
        <div class="hint" id="pullHint"></div>
      </div>
      <button class="btn skip" id="pullSkip" hidden>건너뛰기 ›</button>
      <div class="multi" id="multi">
        <div class="mhead"><b id="mBest"></b><div class="msum" id="mSum"></div></div>
        <div class="mgrid" id="mGrid"></div>
        <div class="rbtns"><button class="btn" id="mOk">확인</button><button class="btn primary" id="mAgain"></button></div>
      </div>
      <div class="result" id="result">
        <span class="rlabel" id="resRar"></span>
        <h2 id="resName"></h2>
        <p id="resDesc"></p>
        <div class="rbtns">
          <button class="btn" id="btnOk">확인</button>
          <button class="btn primary" id="btnAgain">한 번 더 <i class="ci"></i>1</button>
          <span class="tip">드래그해서 돌려보기</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 전투 -->
  <section id="tab-battle" class="tab">
    <div id="arena">
      <canvas id="bcv"></canvas>
      <div class="bhud" id="bhud" hidden>
        <div class="bh-left">
          <div class="hpbar"><i id="bHp"></i><span id="bHpT"></span></div>
          <div class="bh-wave"><b id="bWave"></b><span id="bTime"></span></div>
        </div>
        <div class="bossbar" id="bBoss" hidden><span id="bBossName"></span><div class="bar"><i id="bBossHp"></i></div></div>
        <div class="bh-right">
          <span title="이번 판에서 모은 조각"><i class="si"></i><b id="bShards">0</b></span>
          <span>처치 <b id="bKills">0</b></span>
          <button class="bpause" id="bPauseBtn" aria-label="일시정지"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        </div>
      </div>
      <div class="bbanner" id="bBanner"></div>

      <div class="bpanel show" id="bLobby"></div>
      <div class="bpanel" id="bPerk"></div>
      <div class="bpanel" id="bPause"></div>
      <div class="bpanel" id="bEnd"></div>
    </div>
  </section>

  <!-- 단어 외우기 -->
  <section id="tab-study" class="tab page">
    <div class="wrap">
      <div class="wordnav seg"><button data-tab="study">단어 외우기</button><button data-tab="test">단어 테스트</button></div>
      <div class="study-top">
        <div class="seg" id="studySeg"><button data-f="all" class="on">전체</button><button data-f="miss">틀린 단어</button></div>
        <span id="cardPos"></span>
      </div>
      <div class="chips" id="catChips"></div>
      <div class="flash-card" id="fcard">
        <div class="fc-inner">
          <div class="fc-front"><span class="fc-cat" id="fcCat"></span><div class="fc-ko" id="fcKo"></div><div class="fc-tip">영어로 뭘까? 눌러서 확인</div></div>
          <div class="fc-back"><div class="fc-en" id="fcEn"></div><div class="fc-ko-small" id="fcKo2"></div></div>
        </div>
      </div>
      <div class="fc-btns">
        <button class="btn" id="fcPrev">이전</button>
        <button class="btn" id="fcSpeak">발음 듣기</button>
        <button class="btn" id="fcShuffle">섞기</button>
        <button class="btn" id="fcNext">다음</button>
      </div>
      <div class="go-test"><button class="btn primary" id="goTest">테스트 보고 코인 받기</button></div>

      <h3>단어 목록 <small id="wordCount"></small></h3>
      <div id="wordList"></div>
    </div>
  </section>

  <!-- 단어 테스트: 뜻을 보고 영어 단어를 직접 쓴다 -->
  <section id="tab-test" class="tab page">
    <div class="wrap">
      <div class="wordnav seg"><button data-tab="study">단어 외우기</button><button data-tab="test">단어 테스트</button></div>
      <div class="test-top">
        <span class="fc-cat" id="qCat"></span>
        <div class="streak">연속 정답<b id="streak">0</b><span class="best">최고 <b id="best">0</b></span></div>
      </div>
      <div class="qcard">
        <div class="qlabel">이 뜻의 영어 단어를 써 보세요</div>
        <div class="qword" id="qWord"></div>
        <div class="tiles" id="tiles"></div>
        <form id="ansForm" class="ansform" autocomplete="off">
          <input id="ans" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="여기에 영어로 입력">
          <button class="btn primary" id="ansBtn">확인</button>
        </form>
        <div class="ime" id="ime">한글로 입력되고 있어요. 한/영 키를 눌러 주세요.</div>
        <div class="qtools">
          <button class="btn" id="hintBtn" type="button">힌트 <span id="hintLeft"></span></button>
          <button class="btn" id="skipBtn" type="button">모르겠어요</button>
        </div>
      </div>
      <div class="feedback" id="feedback"></div>
      <p class="note" id="testNote"></p>
    </div>
  </section>

  <!-- 도감 -->
  <section id="tab-dex" class="tab page">
    <div class="wrap">
      <div class="lvprog" id="lvProg"></div>
      <div class="forge" id="forge"></div>
      <div class="forge" id="shop"></div>
      <div class="dex-stats" id="dexStats"></div>
      <div class="dex-grid" id="dexGrid"></div>
    </div>
  </section>

  <!-- 코인 상점: 캐릭터 스킨, 배경 테마, 효과음, 칭호 -->
  <section id="tab-store" class="tab page">
    <div class="wrap">
      <div class="st-head" id="storeHead"></div>
      <div class="st-bar"><div class="seg" id="storeSeg"></div><span id="storeNote"></span></div>
      <div class="st-grid" id="storeGrid"></div>
    </div>
  </section>

  <!-- 로그인 / 회원가입 -->
  <section id="tab-login" class="tab page">
    <div class="wrap narrow" id="loginBox"></div>
    <div class="wrap narrow" id="profile"></div>
  </section>

  <!-- 랭킹: 이번 달 전투 최고 웨이브 -->
  <section id="tab-rank" class="tab page">
    <div class="wrap">
      <div class="rk-head" id="rkHead"></div>
      <div id="rkAuth"></div>
      <div id="rkMe"></div>
      <div id="rkList"></div>
      <div id="rkPrev"></div>
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="x" id="modalX" aria-label="닫기"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="pv" id="pvWrap"></div>
    <div class="pv-info" id="pvInfo"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="/src/gate.js"></script>
</body>
</html>
